<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>任务清单 · 游戏日常追踪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15111f; --bg-alt:#1c1730; --panel:#241d38; --panel-2:#2c2444; --panel-3:#332a52;
    --border:rgba(255,255,255,0.08); --text:#f2ecdf; --text-muted:#9a8fb0;
    --gold:#f2b705; --teal:#31d9c4; --violet:#a48cf2; --red:#f0475f; --pink:#f26fa0;
    --daily:#f2b705; --weekly:#31d9c4; --biweekly:#a48cf2; --monthly:#f26fa0;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:radial-gradient(ellipse at top, #241a3a 0%, var(--bg) 55%);
    color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; -webkit-tap-highlight-color:transparent;
  }
  .rj{font-family:'Rajdhani',sans-serif;}
  #app{ max-width:480px; margin:0 auto; padding:20px 16px 100px; }

  header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; gap:10px; }
  header h1{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:26px; letter-spacing:0.5px; margin:0; }
  header h1 span{color:var(--gold);}
  header .date{ font-size:12px; color:var(--text-muted); margin-top:4px; }
  .clock-zones{ text-align:right; flex:0 0 auto; }
  .clock-row{ display:flex; align-items:baseline; justify-content:flex-end; gap:5px; font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:600; line-height:1.5; }
  .clock-row .cflag{font-size:12px;}
  .clock-row.cn{color:var(--gold);} .clock-row.uk{color:var(--teal);}
  .settings-toggle{ font-size:10.5px; color:var(--text-muted); margin-top:4px; cursor:pointer; }
  .settings-toggle:hover{ color:var(--gold); }

  .summary{
    background:linear-gradient(135deg,var(--panel),var(--panel-2)); border:1px solid var(--border);
    border-radius:18px; padding:16px 18px; margin-bottom:16px; position:relative; overflow:hidden;
  }
  .summary::after{ content:""; position:absolute; right:-30px;top:-30px; width:100px;height:100px;
    background:radial-gradient(circle, rgba(242,183,5,0.18), transparent 70%); }
  .summary-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .summary-top .label{font-size:13px;color:var(--text-muted);}
  .summary-top .count{ font-family:'Rajdhani',sans-serif; font-size:22px; font-weight:700; }
  .bar-track{ height:8px; border-radius:5px; background:rgba(255,255,255,0.08); overflow:hidden; }
  .bar-fill{ height:100%; background:linear-gradient(90deg,var(--gold),var(--teal)); border-radius:5px; transition:width .35s ease; }
  .summary-empty{font-size:13px;color:var(--text-muted);}

  .game-card{ background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:16px 14px 10px; margin-bottom:16px; }
  .game-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; padding:0 2px; gap:8px; }
  .game-head h2{ font-family:'Rajdhani',sans-serif; font-size:19px; font-weight:700; margin:0 0 4px; }
  .reset-tag{ font-size:11px; font-weight:500; color:var(--text-muted); background:rgba(255,255,255,0.06);
    border-radius:20px; padding:3px 9px; display:inline-flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .reset-tag .sep{opacity:0.4;}
  .icon-btn{ background:none;border:none;color:var(--text-muted); cursor:pointer;padding:6px;border-radius:8px;
    display:flex;align-items:center;justify-content:center; flex:0 0 auto; }
  .icon-btn:hover{color:var(--red);background:rgba(240,71,95,0.1);}

  .weektype-row{ display:flex; align-items:center; gap:8px; margin:8px 2px 4px; flex-wrap:wrap; }
  .weektype-row .wt-label{ font-size:11.5px; color:var(--text-muted); }
  .seg.wt-seg button.active[data-wt="business"]{ background:var(--gold); color:#1a1625; }
  .seg.wt-seg button.active[data-wt="invite"]{ background:var(--violet); color:#1a1625; }
  .seg.rc-pool-seg button.active[data-pool="zhaocai"]{ background:var(--gold); color:#1a1625; }
  .seg.rc-pool-seg button.active[data-pool="zhenxuan"]{ background:var(--pink); color:#1a1625; }

  .section-label{ font-family:'Rajdhani',sans-serif; font-size:12.5px; font-weight:700; letter-spacing:0.8px;
    color:var(--text-muted); text-transform:uppercase; margin:10px 2px 6px; }

  .task-ticket{ position:relative; background:var(--panel-2); border-radius:12px; padding:11px 14px; margin-bottom:8px;
    display:flex; align-items:center; gap:12px;
    background-image: radial-gradient(circle 7px at 0 50%, var(--panel) 7px, transparent 7.5px),
      radial-gradient(circle 7px at 100% 50%, var(--panel) 7px, transparent 7.5px); }
  .task-ticket.mini{ background:var(--panel-3); padding:9px 12px;
    background-image: radial-gradient(circle 6px at 0 50%, var(--panel-2) 6px, transparent 6.5px),
      radial-gradient(circle 6px at 100% 50%, var(--panel-2) 6px, transparent 6.5px); }
  .task-ticket.done{opacity:0.5;}
  .task-ticket.wt-inactive{opacity:0.32;}
  .checkbox{ flex:0 0 auto; width:26px;height:26px; border-radius:50%; border:2px solid var(--text-muted);
    display:flex;align-items:center;justify-content:center; cursor:pointer; transition:all .15s ease; font-size:14px; }
  .task-ticket.mini .checkbox{width:22px;height:22px;font-size:12px;}
  .task-ticket[data-freq="daily"] .checkbox{border-color:var(--daily);}
  .task-ticket[data-freq="weekly"] .checkbox{border-color:var(--weekly);}
  .task-ticket[data-freq="biweekly"] .checkbox{border-color:var(--biweekly);}
  .task-ticket[data-freq="monthly"] .checkbox{border-color:var(--monthly);}
  .task-ticket[data-freq="event"] .checkbox{border-color:var(--violet);}
  .checkbox.checked{background:var(--gold);border-color:var(--gold);color:#1a1625;}
  .task-ticket[data-freq="weekly"] .checkbox.checked{background:var(--teal);border-color:var(--teal);}
  .task-ticket[data-freq="biweekly"] .checkbox.checked{background:var(--violet);border-color:var(--violet);}
  .task-ticket[data-freq="monthly"] .checkbox.checked{background:var(--monthly);border-color:var(--monthly);}
  .task-ticket[data-freq="event"] .checkbox.checked{background:var(--violet);border-color:var(--violet);}
  .task-body{flex:1;min-width:0;}
  .task-name{ font-size:14.5px; font-weight:500; word-break:break-word; }
  .task-ticket.mini .task-name{font-size:13.5px;}
  .task-ticket.done .task-name{text-decoration:line-through;color:var(--text-muted);}
  .task-meta{ display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap; }
  .freq-badge, .time-badge, .wt-badge{ font-size:10.5px; font-family:'Rajdhani',sans-serif; font-weight:600;
    letter-spacing:0.3px; padding:1px 7px; border-radius:20px; }
  .task-ticket[data-freq="daily"] .freq-badge{color:var(--daily);background:rgba(242,183,5,0.14);}
  .task-ticket[data-freq="weekly"] .freq-badge{color:var(--weekly);background:rgba(49,217,196,0.14);}
  .task-ticket[data-freq="biweekly"] .freq-badge{color:var(--biweekly);background:rgba(164,140,242,0.16);}
  .task-ticket[data-freq="monthly"] .freq-badge{color:var(--monthly);background:rgba(242,111,160,0.16);}
  .task-ticket[data-freq="event"] .freq-badge{color:var(--violet);background:rgba(164,140,242,0.16);}
  .time-badge{ color:var(--text-muted); background:rgba(255,255,255,0.07); }
  .wt-badge.business{ color:var(--gold); background:rgba(242,183,5,0.14); }
  .wt-badge.invite{ color:var(--violet); background:rgba(164,140,242,0.16); }
  .streak{font-size:10.5px;color:var(--text-muted);}
  .streak b{color:var(--gold);}
  .empty-tasks{ font-size:12.5px;color:var(--text-muted);padding:8px 4px 12px; }

  .event-card{ background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:12px 12px 8px; margin-bottom:10px; }
  .event-card[data-status="ended"]{ opacity:0.55; }
  .event-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px; }
  .event-name{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15.5px; }
  .event-range{ font-size:11px; color:var(--text-muted); margin-top:3px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .status-badge{ font-size:10px; font-weight:700; padding:1px 8px; border-radius:20px; font-family:'Rajdhani',sans-serif; }
  .status-badge.ongoing{ color:var(--teal); background:rgba(49,217,196,0.16); }
  .status-badge.upcoming{ color:var(--gold); background:rgba(242,183,5,0.16); }
  .status-badge.ended{ color:var(--text-muted); background:rgba(255,255,255,0.08); }

  .add-task-row{ display:flex;align-items:center;gap:6px; font-size:13px;color:var(--text-muted); padding:8px 6px 4px;cursor:pointer; }
  .add-task-row.event-add{ font-size:12.5px; padding:4px 4px 2px; }
  .add-task-row:hover{color:var(--gold);}
  .inline-form{ background:rgba(255,255,255,0.03); border:1px dashed var(--border); border-radius:12px; padding:12px; margin:6px 0 12px; }
  .inline-form.mini-form{ padding:10px; margin:4px 0 8px; background:rgba(255,255,255,0.04); }
  .inline-form input[type=text], .inline-form input[type=date], .inline-form input[type=time], .inline-form input[type=number]{
    width:100%; background:var(--bg-alt); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:9px 10px; font-size:14px; margin-bottom:8px; font-family:'Inter',sans-serif; }
  .inline-form input[type=date]::-webkit-calendar-picker-indicator, .inline-form input[type=time]::-webkit-calendar-picker-indicator{ filter:invert(0.7); }
  .row-flex{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center;}
  .field-label{font-size:12px;color:var(--text-muted);width:100%;margin-bottom:2px;}
  .chk-label{ display:flex; align-items:center; gap:7px; font-size:13px; color:var(--text-muted); cursor:pointer; }
  .chk-label input{ accent-color:var(--teal); width:15px;height:15px; }
  .date-field{ flex:1; min-width:130px; }
  .date-field.disabled{ opacity:0.4; pointer-events:none; }
  .seg{ display:flex;background:var(--bg-alt);border-radius:8px;overflow:hidden;border:1px solid var(--border); flex-wrap:wrap; }
  .seg button{ border:none;background:none;color:var(--text-muted); font-size:12.5px;padding:7px 12px;cursor:pointer;
    font-family:'Inter',sans-serif; white-space:nowrap; }
  .seg button.active{background:var(--gold);color:#1a1625;font-weight:600;}
  .seg.zone-seg button.active{background:var(--teal);color:#0e1c1c;}
  select{ background:var(--bg-alt);border:1px solid var(--border);color:var(--text); border-radius:8px;padding:7px 9px;font-size:12.5px; }
  .form-actions{display:flex;gap:8px;justify-content:flex-end;}
  .btn{ border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer; font-family:'Inter',sans-serif; }
  .btn-primary{background:var(--gold);color:#1a1625;}
  .btn-ghost{background:none;color:var(--text-muted);}
  .btn-ghost:hover{color:var(--text);}
  .btn-small{ padding:6px 10px; font-size:12px; border-radius:7px; background:var(--panel-3); color:var(--text); }
  .btn-danger{ background:var(--red); color:#fff; }
  .confirm-bar{ background:rgba(240,71,95,0.1); border:1px solid rgba(240,71,95,0.35); border-radius:10px;
    padding:10px 12px; margin:-4px 0 10px; font-size:12.5px; color:var(--text); }
  .confirm-bar .form-actions{ margin-top:8px; }
  .inline-notice{ font-size:12.5px; color:var(--text-muted); background:rgba(255,255,255,0.05);
    border-radius:10px; padding:9px 12px; margin:-6px 0 16px; }
  .form-error{ font-size:12px; color:var(--red); margin:-4px 0 8px; }

  .add-game-row{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .add-game-card{ flex:1; border:1.5px dashed var(--border); border-radius:18px; padding:14px; text-align:center;
    color:var(--text-muted); cursor:pointer; font-size:14px; min-width:140px; }
  .add-game-card:hover{border-color:var(--gold);color:var(--gold);}
  .add-game-card.preset-btn{ border-style:solid; border-color:var(--violet); color:var(--violet); background:rgba(164,140,242,0.08); }
  .add-game-card.preset-btn:hover{ background:rgba(164,140,242,0.16); }

  .weekday-picker{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
  .weekday-picker button{ width:34px;height:30px;border-radius:7px;border:1px solid var(--border);
    background:var(--bg-alt);color:var(--text-muted);font-size:12px;cursor:pointer; }
  .weekday-picker button.active{background:var(--teal);color:#0e1c1c;border-color:var(--teal);font-weight:700;}

  .loading, .error-box{ text-align:center;color:var(--text-muted);padding:60px 10px;font-size:14px; }
  .error-box{color:var(--red);}
  .footer-note{ text-align:center;color:var(--text-muted);font-size:11.5px;margin-top:10px;opacity:0.7; }

  /* recharge panel */
  .recharge-panel{ background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:6px; }
  .rc-cycle-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:6px; }
  .rc-pool{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; }
  .rc-pool.zhaocai{color:var(--gold);} .rc-pool.zhenxuan{color:var(--pink);}
  .rc-days{ display:flex; gap:6px; margin-bottom:12px; }
  .rc-day-chip{ flex:1; text-align:center; background:var(--panel-3); border-radius:9px; padding:6px 4px; font-size:11px; color:var(--text-muted); }
  .rc-day-chip.today{ background:rgba(242,183,5,0.18); color:var(--gold); font-weight:700; }
  .rc-day-chip.selected{ box-shadow:0 0 0 2px var(--teal) inset; }
  .rc-day-chip .amt{ display:block; font-family:'Rajdhani',sans-serif; font-size:13px; color:var(--text); margin-top:2px; }
  .rc-day-edit{ background:rgba(49,217,196,0.08); border:1px dashed var(--teal); border-radius:10px; padding:10px; margin-bottom:12px; }
  .rc-tier-btns{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .rc-tier-btns button{ background:var(--panel-3); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:6px 10px; font-size:12.5px; cursor:pointer; }
  .rc-tier-btns button:hover{ border-color:var(--gold); }
  .rc-total{ font-size:12.5px; color:var(--text-muted); margin-bottom:8px; }
  .rc-total b{ color:var(--gold); font-family:'Rajdhani',sans-serif; font-size:15px; }
  .rc-calc-row{ display:flex; gap:6px; margin-bottom:6px; flex-wrap:wrap; align-items:center; }
  .rc-calc-result{ margin-top:8px; min-height:16px; }
  .rc-plan-summary{ font-size:12.5px; color:var(--text-muted); margin-bottom:8px; }
  .rc-plan-summary b{ color:var(--gold); font-family:'Rajdhani',sans-serif; }
  .rc-plan-days{ display:flex; gap:8px; margin-bottom:8px; }
  .rc-plan-day{ flex:1; background:var(--panel-3); border-radius:10px; padding:8px 6px 10px; text-align:center; min-width:0; }
  .rc-plan-day.already{ background:rgba(49,217,196,0.1); }
  .rc-plan-date{ font-size:10.5px; color:var(--text-muted); margin-bottom:4px; }
  .rc-plan-day.today .rc-plan-date{ color:var(--gold); font-weight:700; }
  .rc-plan-amt{ font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:700; color:var(--text); }
  .rc-plan-day.already .rc-plan-amt{ color:var(--teal); font-size:13px; }
  .rc-plan-sub{ font-size:9.5px; color:var(--text-muted); margin-top:1px; }
  .rc-plan-bar-track{ height:5px; border-radius:4px; background:rgba(255,255,255,0.08); margin-top:6px; overflow:hidden; }
  .rc-plan-bar-fill{ height:100%; background:linear-gradient(90deg,var(--gold),var(--pink)); border-radius:4px; }
  .rc-plan-total{ font-size:12.5px; color:var(--teal); }
  .rc-plan-total b{ font-family:'Rajdhani',sans-serif; font-size:15px; }
  .rc-plan-short{ font-size:12.5px; color:var(--red); }
  .rc-ref-table{ font-size:11px; color:var(--text-muted); line-height:1.8; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
  .rc-ref-table b{ color:var(--text); }
  .rc-ref-title{ font-size:11.5px; font-weight:700; color:var(--text-muted); margin-bottom:2px; }
</style>
</head>
<body>
<div id="app"><div class="loading">加载中…</div></div>

<script>
const STORAGE_KEY = 'gametasktracker:data';
let state = { games: [], settings: { showDualZone: true, userZone: 'Europe/London' } };
let openAddTaskFor = null;
let openAddGame = false;
let openAddEventFor = null;
let openAddEventTaskFor = null;
let openAddRechargeFor = null;
let openEditResetFor = null;
let openEditTaskFor = null;      // {gameId, taskId}
let openEditEventTaskFor = null; // {gameId, eventId, taskId}
let openEditRechargeDayFor = null; // {gameId, date}
let rechargeCalcFor = null; // {gameId, target} — persists the last "算一下" result across re-renders
let openSettings = false;
let confirmDeleteTarget = null; // {type:'game'|'event'|'recharge', gameId, eventId}
let presetAddNotice = null;

let selectedWeekdays = [new Date().getDay()];
let addGameZonePick = 'Asia/Shanghai';

const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
const ZONES = {

// since that's already the fixed baseline shown everywhere)
const USER_ZONE_OPTIONS = [
  'Pacific/Pago_Pago','Pacific/Honolulu','America/Anchorage','America/Vancouver','America/Los_Angeles','America/Denver',
  'America/Mexico_City','America/Chicago','America/Toronto','America/New_York','America/Halifax','America/Sao_Paulo','Atlantic/South_Georgia',
  'Atlantic/Azores','Europe/London','Europe/Paris','Europe/Berlin','Africa/Cairo','Europe/Moscow',
  'Asia/Tehran','Asia/Dubai','Asia/Kabul','Asia/Karachi','Asia/Kolkata','Asia/Kathmandu','Asia/Dhaka',
  'Asia/Yangon','Asia/Bangkok','Asia/Singapore','Asia/Hong_Kong','Australia/Perth','Asia/Tokyo','Asia/Seoul',
  'Australia/Darwin','Australia/Sydney','Pacific/Noumea','Pacific/Auckland','Pacific/Tongatapu','Pacific/Kiritimati'
];
const RECHARGE_TIERS = [6,30,68,128,328,648];
const CUMULATIVE_TIERS = [30,68,128,328,648,988,1288,1888];

function pad(n){ return String(n).padStart(2,'0'); }
function dateStrUTC(d){ return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; }
function todayLocalStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

function tzOffsetMinutes(timeZone, date){
  const d = new Date(date); d.setSeconds(0, 0); // truncate to a whole minute so both
  // sides of the comparison below line up exactly — otherwise leftover seconds cause a
  // systematic ±1 minute rounding error in the offset (and every conversion using it).
  const dtf = new Intl.DateTimeFormat('en-US', { timeZone, hourCycle:'h23',
    year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  const parts = {};
  dtf.formatToParts(d).forEach(p => { if(p.type !== 'literal') parts[p.type] = p.value; });
  const asUTC = Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour, +parts.minute);
  return Math.round((asUTC - d.getTime()) / 60000);
}
function nowInZone(timeZone){
  const now = new Date();
  const dtf = new Intl.DateTimeFormat('en-CA', { timeZone, hourCycle:'h23',
    year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  const parts = {};
  dtf.formatToParts(now).forEach(p => { if(p.type !== 'literal') parts[p.type] = p.value; });
  return { y:+parts.year, mo:+parts.month, da:+parts.day, hr:+parts.hour, mi:+parts.minute };
}
function effectiveDateInZone(resetHour, timeZone){
  const p = nowInZone(timeZone);
  let d = new Date(Date.UTC(p.y, p.mo - 1, p.da));
  if(p.hr < resetHour) d.setUTCDate(d.getUTCDate() - 1);
  return d;
}
function convertClock(hour, minute, fromZone, toZone){
  const now = new Date();
  const offFrom = tzOffsetMinutes(fromZone, now);
  const offTo = tzOffsetMinutes(toZone, now);
  const diffMinutes = offTo - offFrom;
  let totalMin = hour * 60 + minute + diffMinutes;
  let dayShift = 0;
  while(totalMin < 0){ totalMin += 1440; dayShift -= 1; }
  while(totalMin >= 1440){ totalMin -= 1440; dayShift += 1; }
  return { hour: Math.floor(totalMin / 60), minute: totalMin % 60, dayShift };
}
// time-difference display is an independent, opt-in setting (state.settings.showDualZone) —
// when off, only the source zone's own time is shown; when on, it's paired with whichever
// zone the user picked as "我所在的时区" (state.settings.userZone).
function formatTimeBothZones(hour, minute, zone, suffix){
  const s = suffix || '';
  const zA = ZONES[zone] || { flag:'🌐', name:zone };
  const base = `${zA.flag} ${zA.name} ${pad(hour)}:${pad(minute)}${s}`;
  const settings = state.settings || { showDualZone:true, userZone:'Europe/London' };
  if(!settings.showDualZone) return base;
  const other = settings.userZone;
  if(!other || other === zone) return base;
  const conv = convertClock(hour, minute, zone, other);
  const zB = ZONES[other] || { flag:'🌐', name:other };
  const note = conv.dayShift === -1 ? ' 前一天' : conv.dayShift === 1 ? ' 次日' : '';
  return `${base}<span class="sep">·</span>${zB.flag} ${zB.name} ${pad(conv.hour)}:${pad(conv.minute)}${note}${s}`;
}
function formatResetBothZones(hour, zone){ return formatTimeBothZones(hour, 0, zone, ''); }
function gameZone(game){ return game.resetZone || 'Asia/Shanghai'; }
function utcOffsetLabel(zone){
  const mins = tzOffsetMinutes(zone, new Date());
  const sign = mins < 0 ? '-' : '+';
  const abs = Math.abs(mins);
  const h = Math.floor(abs/60), m = abs%60;
  return `UTC${sign}${h}${m ? ':'+pad(m) : ''}`;
}

function mostRecentOccurrence(weekdays, eff){
  let d = new Date(eff);
  for(let i=0;i<7;i++){ if(weekdays.includes(d.getUTCDay())) return d; d.setUTCDate(d.getUTCDate()-1); }
  return eff;
}
function weekStartCanonical(d){ const w = new Date(d); w.setUTCDate(w.getUTCDate() - w.getUTCDay()); return w; }
function daysInMonthUTC(y, m){ return new Date(Date.UTC(y, m+1, 0)).getUTCDate(); }
function mostRecentMonthlyOccurrence(dayOfMonth, eff){
  let d = new Date(eff);
  for(let i=0;i<35;i++){
    const last = daysInMonthUTC(d.getUTCFullYear(), d.getUTCMonth());
    const target = Math.min(dayOfMonth, last);
    if(d.getUTCDate() === target) return d;
    d.setUTCDate(d.getUTCDate()-1);
  }
  return eff;
}

function currentPeriodId(task, game){
  const eff = effectiveDateInZone(game.resetHour, gameZone(game));
  if(task.freq === 'daily') return dateStrUTC(eff);
  if(task.freq === 'monthly') return 'M-' + dateStrUTC(mostRecentMonthlyOccurrence(task.dayOfMonth || 1, eff));
  const occ = mostRecentOccurrence(task.weekdays, eff);
  if(task.freq === 'weekly') return 'W-' + dateStrUTC(occ);
  const ws = weekStartCanonical(occ);
  const anchor = new Date(task.anchor + 'T00:00:00Z');
  const days = Math.round((ws - anchor) / 86400000);
  const idx = Math.floor(days / 14);
  return 'B-' + idx + '-' + occ.getUTCDay();
}
function isDone(task, game){ return (task.history || []).includes(currentPeriodId(task, game)); }
function dailyStreak(task, game){
  if(task.freq !== 'daily') return 0;
  const set = new Set(task.history || []);
  let streak = 0;
  let d = effectiveDateInZone(game.resetHour, gameZone(game));
  while(set.has(dateStrUTC(d))){ streak++; d.setUTCDate(d.getUTCDate()-1); }
  return streak;
}
// current week-type (商战周/邀请赛周), auto-alternating weekly from a reference week —
// same pattern as the recharge pool's 4-day cycle, but on a 7-day cadence.
function currentWeekType(game){
  if(!game.weekTypeRef) return 'business';
  const zone = gameZone(game);
  const eff = effectiveDateInZone(game.resetHour, zone);
  const ws = weekStartCanonical(eff);
  const refWs = new Date(game.weekTypeRef.weekStart + 'T00:00:00Z');
  const weeksDiff = Math.round((ws - refWs) / (7*86400000));
  const parity = ((weeksDiff % 2) + 2) % 2;
  return parity === 0 ? game.weekTypeRef.type : (game.weekTypeRef.type === 'business' ? 'invite' : 'business');
}
function isTaskActive(task, game){ return !task.weekType || task.weekType === currentWeekType(game); }
function isTaskDueToday(task, game){
  if(task.freq === 'daily') return true;
  const eff = effectiveDateInZone(game.resetHour, gameZone(game));
  if(task.freq === 'monthly'){
    const last = daysInMonthUTC(eff.getUTCFullYear(), eff.getUTCMonth());
    const target = Math.min(task.dayOfMonth || 1, last);
    return eff.getUTCDate() === target;
  }
  return (task.weekdays || []).includes(eff.getUTCDay());
}
function freqLabel(task){
  if(task.freq === 'daily') return '每日';
  if(task.freq === 'monthly') return '每月 · ' + (task.dayOfMonth||1) + '日';
  const days = (task.weekdays || []).slice().sort((a,b)=>a-b).map(i=>WEEKDAYS[i].replace('周',''));
  const daysStr = days.join('、');
  return (task.freq === 'weekly' ? '每周 · ' : '每两周 · ') + daysStr;
}
function weekTypeLabel(wt){ return wt === 'business' ? '商战周' : wt === 'invite' ? '邀请赛周' : ''; }

function eventStatus(event, game){
  const zone = gameZone(game);
  const todayStr = dateStrUTC(effectiveDateInZone(0, zone));
  if(event.permanent) return { code:'ongoing', label:'长期活动' };
  if(event.startDate && todayStr < event.startDate){
    const days = Math.round((new Date(event.startDate+'T00:00:00Z') - new Date(todayStr+'T00:00:00Z'))/86400000);
    return { code:'upcoming', label:`${days} 天后开始` };
  }
  if(event.endDate && todayStr > event.endDate) return { code:'ended', label:'已结束' };
  if(event.endDate){
    const days = Math.round((new Date(event.endDate+'T00:00:00Z') - new Date(todayStr+'T00:00:00Z'))/86400000);
    return { code:'ongoing', label: days<=0 ? '今天结束' : `进行中 · 还剩 ${days} 天` };
  }
  return { code:'ongoing', label:'进行中' };
}
function eventRangeLabel(event){
  if(event.permanent) return '长期开放';
  if(event.startDate && event.endDate) return `${event.startDate} ~ ${event.endDate}`;
  if(event.startDate) return `自 ${event.startDate} 起`;
  if(event.endDate) return `至 ${event.endDate}`;
  return '未设置日期';
}

// ---- recharge helpers ----
function cycleInfo(recharge){
  const today = todayLocalStr();
  const ref = new Date(recharge.refDate+'T00:00:00Z');
  const t = new Date(today+'T00:00:00Z');
  const daysSince = Math.round((t-ref)/86400000);
  const cycleIdx = Math.floor(daysSince/4);
  const dayInCycle = ((daysSince%4)+4)%4 + 1;
  const pool = (((cycleIdx%2)+2)%2===0) ? recharge.refPool : (recharge.refPool==='zhenxuan'?'zhaocai':'zhenxuan');
  const cycleStart = new Date(ref); cycleStart.setUTCDate(cycleStart.getUTCDate()+cycleIdx*4);
  const dates = [0,1,2,3].map(i=>{ const d=new Date(cycleStart); d.setUTCDate(d.getUTCDate()+i); return dateStrUTC(d); });
  const total = dates.reduce((s,d)=> s + (recharge.log[d]||0), 0);
  return { today, dayInCycle, pool, dates, total, daysLeft: 4-dayInCycle+1 };
}
// build a day-by-day recharge plan for the remaining days of the cycle. A single day's
// charge can be ANY combination of tiers (e.g. ¥328 + ¥128, not just one tier repeated),
// so this solves the true minimum-total problem: find the smallest total sum >= remain
// that can be split into at least n charges (n = un-charged remaining days, each needs
// >=1 charge), using a small dynamic program over (coin count, sum).
function buildRechargePlan(target, info, log){
  const remainDates = info.dates.slice(info.dayInCycle - 1); // today onward
  const remain = Math.max(0, target - info.total);
  // days that already have something logged don't need a fresh suggestion —
  // only plan for the days that haven't been charged yet
  const toPlan = remainDates.filter(d => !(log[d] > 0));
  const already = remainDates.filter(d => log[d] > 0);
  const buildEntry = d => already.includes(d)
    ? { date:d, cost:0, label:null, alreadyAmount: log[d] }
    : null;

  if(remain === 0 || toPlan.length === 0){
    const plan = remainDates.map(d => buildEntry(d) || { date:d, cost:0, label:'不用充' });
    return { plan, shortBy: remain };
  }

  const n = toPlan.length;
  const maxTier = RECHARGE_TIERS[RECHARGE_TIERS.length-1];
  const CAP_C = n + 12;                 // generous cap on total number of charges considered
  const CAP_S = remain + maxTier * 2;   // generous cap on total sum considered

  // dp[c][s] = true if sum `s` is reachable using exactly `c` charges (repeats allowed).
  // parent[c][s] = which tier was used last, for path reconstruction.
  const dp = Array.from({length:CAP_C+1}, ()=> new Uint8Array(CAP_S+1));
  const parent = Array.from({length:CAP_C+1}, ()=> new Int16Array(CAP_S+1).fill(-1));
  dp[0][0] = 1;
  for(let c=1;c<=CAP_C;c++){
    const prev = dp[c-1], cur = dp[c], par = parent[c];
    for(let s=0;s<=CAP_S;s++){
      for(const t of RECHARGE_TIERS){
        if(s-t>=0 && prev[s-t]){ cur[s]=1; par[s]=t; break; }
      }
    }
  }

  // scan sums ascending from `remain` — the first reachable sum (with >=n charges) is the
  // global minimum total. Among the coin-counts that can reach it, prefer the fewest charges.
  let bestS=-1, bestC=-1;
  for(let s=remain; s<=CAP_S && bestS===-1; s++){
    for(let c=n; c<=CAP_C; c++){
      if(dp[c][s]){ bestS=s; bestC=c; break; }
    }
  }

  let toPlanResults, shortBy = 0;
  if(bestS !== -1){
    // reconstruct the exact list of charges used
    let coins=[], c=bestC, s=bestS;
    while(c>0){ const t=parent[c][s]; coins.push(t); s-=t; c--; }
    coins.sort((a,b)=>b-a); // front-load bigger charges
    const dayCoins = Array.from({length:n}, ()=>[]);
    coins.forEach((t,i)=> dayCoins[i%n].push(t)); // spread charges round-robin across days
    toPlanResults = dayCoins.map(coinsForDay=>{
      const cost = coinsForDay.reduce((a,b)=>a+b,0);
      const counts = {};
      coinsForDay.forEach(t=> counts[t]=(counts[t]||0)+1);
      const label = Object.keys(counts).map(Number).sort((a,b)=>b-a)
        .map(t=> counts[t]>1 ? `${counts[t]}×¥${t}` : `¥${t}`).join(' + ');
      return { cost, label };
    });
  } else {
    // fallback: even the generous cap wasn't enough — max out every day
    toPlanResults = toPlan.map(()=>({ cost:maxTier, label:`¥${maxTier}` }));
    shortBy = remain - maxTier*n;
  }

  let i = 0;
  const plan = remainDates.map(d => buildEntry(d) || { date:d, cost: toPlanResults[i].cost, label: toPlanResults[i++].label });
  return { plan, shortBy };
}

function uid(){ return Math.random().toString(36).slice(2,10); }

function normalize(){
  state.settings = state.settings || { showDualZone: true, userZone: 'Europe/London' };
  state.games.forEach(g=>{
    g.resetZone = g.resetZone || 'Asia/Shanghai';
    g.tasks = g.tasks || [];
    g.events = g.events || [];
    if(!g.weekTypeRef){
      // migrate: anchor to the week containing "today", using whatever manual
      // weekType was previously set (or 'business' as a sane default)
      const eff = effectiveDateInZone(g.resetHour, gameZone(g));
      g.weekTypeRef = { weekStart: dateStrUTC(weekStartCanonical(eff)), type: g.currentWeekType || 'business' };
    }
    delete g.currentWeekType;
    g.events.forEach(e=>{ e.tasks = e.tasks || []; });
    g.tasks.forEach(t=>{
      if(t.freq === 'weekly' || t.freq === 'biweekly'){
        if(!t.weekdays || !t.weekdays.length) t.weekdays = [typeof t.weekday === 'number' ? t.weekday : 0];
        if(t.freq === 'biweekly' && t.anchor){
          const canon = weekStartCanonical(new Date(t.anchor + 'T00:00:00Z'));
          t.anchor = dateStrUTC(canon);
        }
      }
      if(t.freq === 'monthly' && !t.dayOfMonth) t.dayOfMonth = 1;
      t.weekType = t.weekType || null;
      t.time = t.time || null;
    });
    if(g.recharge) g.recharge.log = g.recharge.log || {};
  });
}

// STANDALONE VERSION: uses the browser's own localStorage instead of Claude's
// artifact storage API, so this file works fully offline outside Claude —
// but data then lives only on this device/browser, not synced anywhere.
async function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){ state = { games: [] }; }
  normalize();
  storageReady = true;
  render();
}
async function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('保存失败', e); }
}

function addGame(name, resetHour, resetZone){
  const eff = effectiveDateInZone(resetHour, resetZone);
  state.games.push({
    id: uid(), name, resetHour, resetZone, tasks: [], events: [],
    weekTypeRef: { weekStart: dateStrUTC(weekStartCanonical(eff)), type: 'business' }
  });
  save(); render();
}
function deleteGame(gameId){ state.games = state.games.filter(g=>g.id!==gameId); save(); render(); }
function setGameReset(gameId, resetHour, resetZone){
  const game = state.games.find(g=>g.id===gameId);
  game.resetHour = resetHour; game.resetZone = resetZone;
  save(); render();
}
function setWeekType(gameId, wt){
  const game = state.games.find(g=>g.id===gameId);
  const eff = effectiveDateInZone(game.resetHour, gameZone(game));
  game.weekTypeRef = { weekStart: dateStrUTC(weekStartCanonical(eff)), type: wt };
  save(); render();
}

function addTask(gameId, name, freq, weekdaysArr, opts){
  opts = opts || {};
  const game = state.games.find(g=>g.id===gameId);
  const task = { id: uid(), name, freq, history: [], time: opts.time || null, weekType: opts.weekType || null };
  if(freq === 'weekly' || freq === 'biweekly') task.weekdays = weekdaysArr.slice().sort((a,b)=>a-b);
  if(freq === 'monthly') task.dayOfMonth = opts.dayOfMonth || 1;
  if(freq === 'biweekly'){
    const eff = effectiveDateInZone(game.resetHour, gameZone(game));
    task.anchor = dateStrUTC(weekStartCanonical(eff));
  }
  game.tasks.push(task);
  save(); render();
}
function deleteTask(gameId, taskId){
  const game = state.games.find(g=>g.id===gameId);
  game.tasks = game.tasks.filter(t=>t.id!==taskId);
  save(); render();
}
function updateTask(gameId, taskId, patch){
  const game = state.games.find(g=>g.id===gameId);
  const task = game.tasks.find(t=>t.id===taskId);
  const freqChanged = patch.freq !== task.freq;
  const weekdaysChanged = JSON.stringify(patch.weekdays) !== JSON.stringify(task.weekdays);
  task.name = patch.name;
  task.freq = patch.freq;
  task.weekdays = patch.weekdays;
  task.dayOfMonth = patch.dayOfMonth;
  task.time = patch.time;
  task.weekType = patch.weekType;
  if(task.freq === 'biweekly' && (freqChanged || weekdaysChanged || !task.anchor)){
    const eff = effectiveDateInZone(game.resetHour, gameZone(game));
    task.anchor = dateStrUTC(weekStartCanonical(eff));
  }
  if(freqChanged) task.history = [];
  save(); render();
}
function toggleTask(gameId, taskId){
  const game = state.games.find(g=>g.id===gameId);
  const task = game.tasks.find(t=>t.id===taskId);
  const pid = currentPeriodId(task, game);
  task.history = task.history || [];
  const idx = task.history.indexOf(pid);
  if(idx >= 0) task.history.splice(idx,1); else task.history.push(pid);
  save(); render();
}

function addEvent(gameId, name, startDate, endDate, permanent){
  const game = state.games.find(g=>g.id===gameId);
  game.events.push({ id: uid(), name, startDate: startDate||null, endDate: permanent?null:(endDate||null), permanent, tasks: [] });
  save(); render();
}
function deleteEvent(gameId, eventId){
  const game = state.games.find(g=>g.id===gameId);
  game.events = game.events.filter(e=>e.id!==eventId);
  save(); render();
}
function addEventTask(gameId, eventId, name, time){
  const game = state.games.find(g=>g.id===gameId);
  const event = game.events.find(e=>e.id===eventId);
  event.tasks.push({ id: uid(), name, time: time || null, done:false });
  save(); render();
}
function deleteEventTask(gameId, eventId, taskId){
  const game = state.games.find(g=>g.id===gameId);
  const event = game.events.find(e=>e.id===eventId);
  event.tasks = event.tasks.filter(t=>t.id!==taskId);
  save(); render();
}
function updateEventTask(gameId, eventId, taskId, name, time){
  const game = state.games.find(g=>g.id===gameId);
  const event = game.events.find(e=>e.id===eventId);
  const task = event.tasks.find(t=>t.id===taskId);
  task.name = name; task.time = time;
  save(); render();
}
function toggleEventTask(gameId, eventId, taskId){
  const game = state.games.find(g=>g.id===gameId);
  const event = game.events.find(e=>e.id===eventId);
  const task = event.tasks.find(t=>t.id===taskId);
  task.done = !task.done;
  save(); render();
}

function enableRecharge(gameId, refDate, refPool){
  const game = state.games.find(g=>g.id===gameId);
  game.recharge = { refDate, refPool, log:{} };
  save(); render();
}
function setRechargeDay(gameId, date, amount){
  const game = state.games.find(g=>g.id===gameId);
  if(amount > 0) game.recharge.log[date] = amount;
  else delete game.recharge.log[date];
  save(); render();
}
function setRechargePool(gameId, pool){
  const game = state.games.find(g=>g.id===gameId);
  const info = cycleInfo(game.recharge);
  // re-anchor the reference to this cycle's start date with the corrected pool, so both
  // "today" and future 4-day cycles alternate correctly from here on
  game.recharge.refDate = info.dates[0];
  game.recharge.refPool = pool;
  save(); render();
}
function setSettings(patch){
  state.settings = Object.assign({}, state.settings, patch);
  save(); render();
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderRechargePlanHTML(game, info, target){
  if(info.total >= target){
    return `<div class="rc-plan-total">已经达到 ¥${target} 档位啦 🎉</div>`;
  }
  const { plan, shortBy } = buildRechargePlan(target, info, game.recharge.log);
  const newCost = plan.reduce((s,p)=>s + (p.alreadyAmount ? 0 : p.cost), 0);
  const maxAmt = Math.max(1, ...plan.map(p=> p.alreadyAmount || p.cost));
  const dayCards = plan.map(p=>{
    const label = p.date === info.today ? '今天' : p.date.slice(5);
    const todayCls = p.date === info.today ? 'today' : '';
    if(p.alreadyAmount){
      return `<div class="rc-plan-day already ${todayCls}">
        <div class="rc-plan-date">${label}</div>
        <div class="rc-plan-amt">¥${p.alreadyAmount}</div>
        <div class="rc-plan-sub">已充 · 无需再充</div>
      </div>`;
    }
    const barPct = Math.round((p.cost / maxAmt) * 100);
    return `<div class="rc-plan-day ${todayCls}">
      <div class="rc-plan-date">${label}</div>
      <div class="rc-plan-amt">¥${p.cost}</div>
      <div class="rc-plan-sub">${p.cost === 0 ? '不用充' : p.label}</div>
      <div class="rc-plan-bar-track"><div class="rc-plan-bar-fill" style="width:${barPct}%"></div></div>
    </div>`;
  }).join('');
  if(shortBy > 0){
    return `<div class="rc-plan-days">${dayCards}</div>
      <div class="rc-plan-short">就算未充值的天数每天都充满，还差¥${shortBy}，可能需要额外加充一次</div>`;
  }
  return `<div class="rc-plan-summary">还差 <b>¥${target - info.total}</b>，剩余未充天数都充、总花费最少的方案：</div>
    <div class="rc-plan-days">${dayCards}</div>
    <div class="rc-plan-total">还需再花 <b>¥${newCost}</b></div>`;
}

      <button class="btn btn-small" data-action="calc-recharge" data-game="${game.id}">算一下</button>
    </div>
    <div class="rc-calc-result" id="rcResult_${game.id}">${rechargeCalcFor && rechargeCalcFor.gameId===game.id ? renderRechargePlanHTML(game, info, rechargeCalcFor.target) : ''}</div>
    <div class="rc-ref-table">
      <div class="rc-ref-title">招财猫参考（每轮次可抽次数）</div>
      0元（2红钻，10%概率10倍，白嫖20）=1次 · <b>¥6</b>=3次 · <b>¥30</b>=4次(2份=5次) · <b>¥68</b>=5次(2份=7次) · <b>¥128</b>=6次(2份=8次) · <b>¥328</b>=7次(2份=9次) · <b>¥648</b>=8次(2份=11次拿满)
      <div class="rc-ref-title" style="margin-top:6px;">甄选集礼参考</div>
      充¥1=1张礼卡；单轮12抽共需526张（各关1/5/12/18/25/33/48/56/66/76/88/98张），重置另需30张，最多2轮后兑换结束
    </div>
  </div>`;
  return html;
}

function render(){
  const app = document.getElementById('app');
  if(!storageReady){ app.innerHTML = '<div class="loading">加载中…</div>'; return; }

  const now = new Date();
  const dateLabel = `${now.getMonth()+1}月${now.getDate()}日 · ${WEEKDAYS[now.getDay()]}`;
  const cnTime = now.toLocaleTimeString('zh-CN', {timeZone:'Asia/Shanghai', hour:'2-digit', minute:'2-digit', hour12:false});
  const settings = state.settings;
  const userZoneInfo = ZONES[settings.userZone] || { flag:'🌐', name:settings.userZone };
  const userTime = settings.showDualZone ? now.toLocaleTimeString('zh-CN', {timeZone:settings.userZone, hour:'2-digit', minute:'2-digit', hour12:false}) : '';

  let total = 0, done = 0;
  state.games.forEach(g=>{
    g.tasks.forEach(t=>{ if(!isTaskActive(t,g) || !isTaskDueToday(t,g)) return; total++; if(isDone(t, g)) done++; });
    g.events.forEach(e=>{
      if(eventStatus(e,g).code!=='ongoing') return;
      e.tasks.forEach(t=>{ total++; if(t.done) done++; });
    });
  });
  const pct = total ? Math.round(done/total*100) : 0;

  let html = `
  <header>
    <div><h1>任务<span>清单</span></h1><div class="date">${dateLabel}</div></div>
    <div class="clock-zones">
      <div class="clock-row cn"><span class="cflag">🇨🇳</span>${cnTime}</div>
      ${settings.showDualZone ? `<div class="clock-row uk"><span class="cflag">${userZoneInfo.flag}</span>${userTime}</div>` : ''}
      <div class="settings-toggle" data-action="toggle-settings">⚙ 时差设置</div>
    </div>
  </header>
  ${openSettings ? `
  <div class="inline-form">
    <label class="chk-label"><input type="checkbox" id="showDualZoneChk" ${settings.showDualZone?'checked':''}> 显示时差（双时区）</label>
    ${settings.showDualZone ? `
    <div class="row-flex" style="margin-top:8px;">
      <span class="field-label" style="width:auto;margin-bottom:0;">我所在的时区</span>
      <select id="userZoneSel">
        ${USER_ZONE_OPTIONS.map(z=>`<option value="${z}" ${settings.userZone===z?'selected':''}>${utcOffsetLabel(z)} ${ZONES[z].flag} ${ZONES[z].name}</option>`).join('')}
      </select>
    </div>` : ''}
    <div class="form-actions" style="margin-top:10px;">
      <button class="btn btn-primary" data-action="close-settings">完成</button>
    </div>
  </div>` : ''}
  <div class="summary">
    ${total === 0 ? `<div class="summary-empty">还没有任务，添加一个游戏开始追踪吧 👇</div>` : `
      <div class="summary-top"><span class="label">当前周期待办完成度</span><span class="count rj">${done}/${total}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>`}
  </div>`;

  state.games.forEach(game=>{ html += renderGameCard(game); });

  if(openAddGame){
    html += `
    <div class="inline-form">
      <div class="add-game-card preset-btn" data-action="add-preset-dulala" style="margin-bottom:12px;">＋杜拉拉升职记（预设任务模板）</div>
      <div class="field-label" style="text-align:center;margin-bottom:10px;">— 或手动添加游戏 —</div>
      <input type="text" id="newGameName" placeholder="游戏名称，例如：王者荣耀" maxlength="30">
      <div class="row-flex">
        <span class="field-label">重置时间所属时区</span>
        <div class="seg zone-seg" id="zoneSeg">
          <button data-zone="Asia/Shanghai" class="${addGameZonePick==='Asia/Shanghai'?'active':''}">🇨🇳 北京时间</button>
          <button data-zone="Europe/London" class="${addGameZonePick==='Europe/London'?'active':''}">🇬🇧 伦敦时间</button>
        </div>
      </div>
      <div class="row-flex">
        <span class="field-label" style="width:auto;margin-bottom:0;">重置时刻</span>
        <select id="resetHourSel">
          ${Array.from({length:24}).map((_,h)=>`<option value="${h}" ${h===0?'selected':''}>${h}:00</option>`).join('')}
        </select>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" data-action="cancel-add-game">取消</button>
        <button class="btn btn-primary" data-action="confirm-add-game">添加</button>
      </div>
    </div>`;
    if(presetAddNotice){ html += `<div class="inline-notice">${escapeHtml(presetAddNotice)}</div>`; }
  } else {
    html += `<div class="add-game-card" data-action="open-add-game">＋ 添加游戏</div>`;
  }

  html += `<div class="footer-note">独立版 · 数据保存在这台设备的浏览器里，换设备/换浏览器不会同步 · 时间可选是否显示双时区</div>`;

  app.innerHTML = html;
  bindEvents();
  document.getElementById('newTaskName')?.focus();
  document.getElementById('newGameName')?.focus();
  document.getElementById('newEventName')?.focus();
  document.getElementById('newEventTaskName')?.focus();
}

function bindEvents(){
  document.querySelectorAll('[data-action="toggle"]').forEach(el=>{
    el.onclick = ()=> toggleTask(el.dataset.game, el.dataset.task);
  });
  document.querySelectorAll('[data-action="toggle-event-task"]').forEach(el=>{
    el.onclick = ()=> toggleEventTask(el.dataset.game, el.dataset.event, el.dataset.task);
  });
  document.querySelectorAll('[data-action="del-game"]').forEach(el=>{
    el.onclick = ()=> { confirmDeleteTarget = { type:'game', gameId: el.dataset.game }; render(); };
  });
  document.querySelectorAll('[data-action="del-task"]').forEach(el=>{
    el.onclick = ()=> deleteTask(el.dataset.game, el.dataset.task);
  });
  document.querySelectorAll('[data-action="del-event"]').forEach(el=>{
    el.onclick = ()=> { confirmDeleteTarget = { type:'event', gameId: el.dataset.game, eventId: el.dataset.event }; render(); };
  });
  document.querySelectorAll('[data-action="del-event-task"]').forEach(el=>{
    el.onclick = ()=> deleteEventTask(el.dataset.game, el.dataset.event, el.dataset.task);
  });
  document.querySelectorAll('[data-action="cancel-delete"]').forEach(el=>{
    el.onclick = ()=> { confirmDeleteTarget = null; render(); };
  });
  document.querySelectorAll('[data-action="confirm-delete-game"]').forEach(el=>{
    el.onclick = ()=> { deleteGame(el.dataset.game); confirmDeleteTarget = null; };
  });
  document.querySelectorAll('[data-action="confirm-delete-event"]').forEach(el=>{
    el.onclick = ()=> { deleteEvent(el.dataset.game, el.dataset.event); confirmDeleteTarget = null; };
  });

  document.querySelectorAll('[data-action="open-edit-reset"]').forEach(el=>{
    el.onclick = ()=> { openEditResetFor = el.dataset.game; render(); };
  });
  document.querySelectorAll('[data-action="cancel-edit-reset"]').forEach(el=>{
    el.onclick = ()=> { openEditResetFor = null; render(); };
  });
  const editZoneSeg = document.getElementById('editZoneSeg');
  if(editZoneSeg){
    editZoneSeg.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{ editZoneSeg.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); };
    });
  }
  document.querySelectorAll('[data-action="confirm-edit-reset"]').forEach(el=>{
    el.onclick = ()=>{
      const resetHour = parseInt(document.getElementById('editResetHourSel').value,10);
      const resetZone = document.querySelector('#editZoneSeg button.active').dataset.zone;
      openEditResetFor = null;
      setGameReset(el.dataset.game, resetHour, resetZone);
    };
  });
  document.querySelectorAll('.wt-seg').forEach(seg=>{
    seg.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=> setWeekType(seg.dataset.game, b.dataset.wt);
    });
  });
  document.querySelectorAll('.rc-pool-seg').forEach(seg=>{
    seg.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=> setRechargePool(seg.dataset.game, b.dataset.pool);
    });
  });

  document.querySelectorAll('[data-action="toggle-settings"]').forEach(el=>{
    el.onclick = ()=> { openSettings = !openSettings; render(); };
  });
  document.querySelectorAll('[data-action="close-settings"]').forEach(el=>{
    el.onclick = ()=> { openSettings = false; render(); };
  });
  const showDualZoneChk = document.getElementById('showDualZoneChk');
  if(showDualZoneChk){
    showDualZoneChk.onchange = ()=> setSettings({ showDualZone: showDualZoneChk.checked });
  }
  const userZoneSel = document.getElementById('userZoneSel');
  if(userZoneSel){
    userZoneSel.onchange = ()=> setSettings({ userZone: userZoneSel.value });
  }

  document.querySelectorAll('[data-action="open-add-task"]').forEach(el=>{
    el.onclick = ()=> { openAddTaskFor = el.dataset.game; openEditTaskFor = null; selectedWeekdays = [new Date().getDay()]; taskFormError = null; render(); };
  });
  document.querySelectorAll('[data-action="cancel-add-task"]').forEach(el=>{
    el.onclick = ()=> { openAddTaskFor = null; taskFormError = null; render(); };
  });
  document.querySelectorAll('[data-action="open-edit-task"]').forEach(el=>{
    el.onclick = ()=>{
      const game = state.games.find(g=>g.id===el.dataset.game);
      const task = game.tasks.find(t=>t.id===el.dataset.task);
      openEditTaskFor = { gameId: el.dataset.game, taskId: el.dataset.task };
      openAddTaskFor = null; taskFormError = null;
      selectedWeekdays = (task.weekdays && task.weekdays.length) ? task.weekdays.slice() : [new Date().getDay()];
      render();
    };
  });
  document.querySelectorAll('[data-action="cancel-edit-task"]').forEach(el=>{
    el.onclick = ()=> { openEditTaskFor = null; taskFormError = null; render(); };
  });
  document.querySelectorAll('[data-action="confirm-edit-task"]').forEach(el=>{
    el.onclick = ()=>{
      const name = document.getElementById('newTaskName').value.trim();
      if(!name){ taskFormError = '请填写任务名称'; render(); return; }
      const freq = document.querySelector('#freqSeg button.active').dataset.freq;
      if((freq==='weekly'||freq==='biweekly') && selectedWeekdays.length === 0){ taskFormError = '请至少选择一个星期'; render(); return; }
      const time = document.getElementById('newTaskTime').value || null;
      const weekType = document.getElementById('newTaskWeekType')?.value || null;
      const dayOfMonth = parseInt(document.getElementById('monthDayInput').value,10) || 1;
      const weekdays = (freq==='weekly'||freq==='biweekly') ? selectedWeekdays.slice().sort((a,b)=>a-b) : null;
      openEditTaskFor = null;
      taskFormError = null;
      updateTask(el.dataset.game, el.dataset.task, { name, freq, weekdays, time, weekType, dayOfMonth });
    };
  });
  document.querySelectorAll('[data-action="confirm-add-task"]').forEach(el=>{
    el.onclick = ()=>{
      const name = document.getElementById('newTaskName').value.trim();
      if(!name){ taskFormError = '请填写任务名称'; render(); return; }
      const freq = document.querySelector('#freqSeg button.active').dataset.freq;
      if((freq==='weekly'||freq==='biweekly') && selectedWeekdays.length === 0){ taskFormError = '请至少选择一个星期'; render(); return; }
      const time = document.getElementById('newTaskTime').value || null;
      const weekType = document.getElementById('newTaskWeekType')?.value || null;
      const dayOfMonth = parseInt(document.getElementById('monthDayInput').value,10) || 1;
      openAddTaskFor = null;
      taskFormError = null;
      addTask(el.dataset.game, name, freq, selectedWeekdays, {time, weekType, dayOfMonth});
    };
  });
  const freqSeg = document.getElementById('freqSeg');
  if(freqSeg){
    freqSeg.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{
        freqSeg.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        document.getElementById('weekdayRow').style.display = (b.dataset.freq==='weekly'||b.dataset.freq==='biweekly') ? 'flex':'none';
        document.getElementById('monthdayRow').style.display = b.dataset.freq==='monthly' ? 'flex':'none';
      };
    });
  }
  document.querySelectorAll('.weekday-picker button').forEach(b=>{
    b.onclick = ()=>{
      const wd = parseInt(b.dataset.wd,10);
      const idx = selectedWeekdays.indexOf(wd);
      if(idx >= 0){
        if(selectedWeekdays.length > 1){ selectedWeekdays.splice(idx,1); b.classList.remove('active'); }
      } else { selectedWeekdays.push(wd); b.classList.add('active'); }
    };
  });

  document.querySelectorAll('[data-action="open-add-game"]').forEach(el=>{ el.onclick = ()=> { openAddGame = true; presetAddNotice = null; render(); }; });
  document.querySelectorAll('[data-action="cancel-add-game"]').forEach(el=>{ el.onclick = ()=> { openAddGame = false; render(); }; });
  document.querySelectorAll('[data-action="add-preset-dulala"]').forEach(el=>{ el.onclick = ()=> addPresetDulala(); });
  const zoneSeg = document.getElementById('zoneSeg');
  if(zoneSeg){
    zoneSeg.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{ addGameZonePick = b.dataset.zone; zoneSeg.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); };
    });
  }
  document.querySelectorAll('[data-action="confirm-add-game"]').forEach(el=>{
    el.onclick = ()=>{
      const name = document.getElementById('newGameName').value.trim();
      if(!name) return;
      const resetHour = parseInt(document.getElementById('resetHourSel').value,10);
      openAddGame = false;
      addGame(name, resetHour, addGameZonePick);
    };
  });

  document.querySelectorAll('[data-action="open-add-event"]').forEach(el=>{ el.onclick = ()=> { openAddEventFor = el.dataset.game; render(); }; });
  document.querySelectorAll('[data-action="cancel-add-event"]').forEach(el=>{ el.onclick = ()=> { openAddEventFor = null; render(); }; });
  const permChk = document.getElementById('newEventPermanent');
  if(permChk){
    permChk.onchange = ()=>{
      const wrap = document.getElementById('eventEndWrap'); const endInput = document.getElementById('newEventEnd');
      if(permChk.checked){ wrap.classList.add('disabled'); endInput.value=''; } else { wrap.classList.remove('disabled'); }
    };
  }
  document.querySelectorAll('[data-action="confirm-add-event"]').forEach(el=>{
    el.onclick = ()=>{
      const name = document.getElementById('newEventName').value.trim();
      if(!name) return;
      const permanent = document.getElementById('newEventPermanent').checked;
      const startDate = document.getElementById('newEventStart').value || null;
      const endDate = permanent ? null : (document.getElementById('newEventEnd').value || null);
      openAddEventFor = null;
      addEvent(el.dataset.game, name, startDate, endDate, permanent);
    };
  });

  document.querySelectorAll('[data-action="open-add-event-task"]').forEach(el=>{
    el.onclick = ()=> { openAddEventTaskFor = { gameId: el.dataset.game, eventId: el.dataset.event }; openEditEventTaskFor = null; render(); };
  });
  document.querySelectorAll('[data-action="cancel-add-event-task"]').forEach(el=>{ el.onclick = ()=> { openAddEventTaskFor = null; render(); }; });
  document.querySelectorAll('[data-action="confirm-add-event-task"]').forEach(el=>{
    el.onclick = ()=>{
      const name = document.getElementById('newEventTaskName').value.trim();
      if(!name) return;
      const time = document.getElementById('newEventTaskTime').value || null;
      openAddEventTaskFor = null;
      addEventTask(el.dataset.game, el.dataset.event, name, time);
    };
  });
  document.querySelectorAll('[data-action="open-edit-event-task"]').forEach(el=>{
    el.onclick = ()=>{
      openEditEventTaskFor = { gameId: el.dataset.game, eventId: el.dataset.event, taskId: el.dataset.task };
      openAddEventTaskFor = null;
      render();
    };
  });
  document.querySelectorAll('[data-action="cancel-edit-event-task"]').forEach(el=>{
    el.onclick = ()=> { openEditEventTaskFor = null; render(); };
  });
  document.querySelectorAll('[data-action="confirm-edit-event-task"]').forEach(el=>{
    el.onclick = ()=>{
      const name = document.getElementById('editEventTaskName').value.trim();
      if(!name) return;
      const time = document.getElementById('editEventTaskTime').value || null;
      openEditEventTaskFor = null;
      updateEventTask(el.dataset.game, el.dataset.event, el.dataset.task, name, time);
    };
  });

  document.querySelectorAll('[data-action="open-add-recharge"]').forEach(el=>{
    el.onclick = ()=> { openAddRechargeFor = el.dataset.game; render(); };
  });
  document.querySelectorAll('[data-action="cancel-add-recharge"]').forEach(el=>{ el.onclick = ()=> { openAddRechargeFor = null; render(); }; });
  const rcPoolSeg = document.getElementById('rcPoolSeg');
  if(rcPoolSeg){ rcPoolSeg.querySelectorAll('button').forEach(b=>{ b.onclick = ()=>{ rcPoolSeg.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); }; }); }
  document.querySelectorAll('[data-action="confirm-add-recharge"]').forEach(el=>{
    el.onclick = ()=>{
      const pool = document.querySelector('#rcPoolSeg button.active').dataset.pool;
      const dayInCycle = parseInt(document.getElementById('rcDayInCycle').value,10);
      const today = new Date(todayLocalStr()+'T00:00:00Z');
      today.setUTCDate(today.getUTCDate() - (dayInCycle-1));
      openAddRechargeFor = null;
      enableRecharge(el.dataset.game, dateStrUTC(today), pool);
    };
  });
  document.querySelectorAll('[data-action="open-edit-recharge-day"]').forEach(el=>{
    el.onclick = ()=>{
      const same = openEditRechargeDayFor && openEditRechargeDayFor.gameId===el.dataset.game && openEditRechargeDayFor.date===el.dataset.date;
      openEditRechargeDayFor = same ? null : { gameId: el.dataset.game, date: el.dataset.date };
      render();
    };
  });
  document.querySelectorAll('[data-action="cancel-edit-recharge-day"]').forEach(el=>{
    el.onclick = ()=> { openEditRechargeDayFor = null; render(); };
  });
  document.querySelectorAll('[data-action="add-recharge-day"]').forEach(el=>{
    el.onclick = ()=>{
      const game = state.games.find(g=>g.id===el.dataset.game);
      const current = game.recharge.log[el.dataset.date] || 0;
      setRechargeDay(el.dataset.game, el.dataset.date, current + parseInt(el.dataset.amt,10));
    };
  });
  document.querySelectorAll('[data-action="reset-recharge-day"]').forEach(el=>{
    el.onclick = ()=> setRechargeDay(el.dataset.game, el.dataset.date, 0);
  });
  document.querySelectorAll('[data-action="calc-recharge"]').forEach(el=>{
    el.onclick = ()=>{
      const gameId = el.dataset.game;
      const target = parseInt(document.getElementById('rcTargetSel_'+gameId).value,10);
      rechargeCalcFor = { gameId, target };
      render();
    };
  });
}

setInterval(()=>{
  if(storageReady && !openAddTaskFor && !openAddGame && !openAddEventFor && !openAddEventTaskFor && !openAddRechargeFor && !openEditResetFor && !openEditTaskFor && !openEditEventTaskFor && !openEditRechargeDayFor) render();
}, 30000);
load();
</script>
</body>
</html>
